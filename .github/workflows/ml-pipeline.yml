name: ML Pipeline

on:
  push:
    branches:
      - main

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      # Change this to your ECR URI
      IMAGE: 418553863256.dkr.ecr.ap-south-1.amazonaws.com/employee-attrition-api:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate and Train
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/validate.py
          python src/train.py
          python src/gate.py

      # ── NEW: Configure AWS Credentials ─────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # ── NEW: Login to Amazon ECR ───────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build and Push to ECR ──────────────────────────────────────────────
      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build -f api/Dockerfile -t ${{ env.IMAGE }} .
          docker push ${{ env.IMAGE }}

      # ── NEW: Update AWS Lambda ─────────────────────────────────────────────
      - name: Update Lambda Function
        run: |
          aws lambda update-function-code \
            --function-name employee-attrition-api \
            --image-uri ${{ env.IMAGE }}
      
